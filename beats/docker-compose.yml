# Siansa Beats: copy this and the .env next to it on the Docker server, then `docker compose up -d`.
# The page is then at http://<that server>:8090: add your music server there, under Setup. No password goes in here
# (0.24.0): the servers, AudioMuse-AI, the page's password and the app's key are set on the page. See README.md.
services:
  beats:
    image: ghcr.io/echovaultstudio/siansa-beats:latest
    container_name: siansa-beats
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      BEATS_MODEL: ${BEATS_MODEL:-final0}
      BEATS_THREADS: ${BEATS_THREADS:-0}
      # Optional: the key the kept secrets are encrypted with, to keep it out of the data volume (else a key file there).
      BEATS_SECRET_KEY: ${BEATS_SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - beats-data:/data
    # A song at a time; the model uses the CPU's cores while it reads one. Lower to keep the server responsive.
    cpus: ${BEATS_CPUS:-4}
    mem_limit: 3g

volumes:
  beats-data:
