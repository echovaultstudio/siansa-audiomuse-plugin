# Siansa Beats: copy this file to the Docker server and run `docker compose up -d`. Nothing needs filling in.
# The page is then at http://<that server>:8090, and its Get started card walks through the rest. No password goes in
# here: the servers, the page's password and the app's key are set on the page. A .env next to this file can change
# the settings below (.env.example lists them); it isn't needed. See README.md.
services:
  beats:
    image: ghcr.io/echovaultstudio/siansa-beats:latest
    container_name: siansa-beats
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      BEATS_MODEL: ${BEATS_MODEL:-final0}
      BEATS_THREADS: ${BEATS_THREADS:-0}
      # Optional: the key the kept secrets are encrypted with, to keep it out of the data volume (else a key file there).
      BEATS_SECRET_KEY: ${BEATS_SECRET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - beats-data:/data
    # A song at a time; the model uses the CPU's cores while it reads one. Lower to keep the server responsive.
    cpus: ${BEATS_CPUS:-4}
    mem_limit: 3g

volumes:
  beats-data:
