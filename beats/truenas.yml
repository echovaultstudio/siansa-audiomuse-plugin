# Siansa Beats on TrueNAS with an NVIDIA GPU: Apps › Discover Apps › ⋮ › Install via YAML, name it siansa-beats,
# paste this and Save. Then open http://<your TrueNAS>:8090 and add your music server under Setup: no password goes
# in this YAML (0.24.0). See README.md ("On TrueNAS with a GPU").
services:
  beats:
    image: ghcr.io/echovaultstudio/siansa-beats:cuda
    container_name: siansa-beats
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      BEATS_MODEL: "final0"
      BEATS_DEVICE: "auto"
      BEATS_FLOAT16: "0"
      LOG_LEVEL: "info"
      NVIDIA_VISIBLE_DEVICES: "all"
    volumes:
      - beats-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  beats-data:
