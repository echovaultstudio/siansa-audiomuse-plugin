# Siansa Beats (beats): its tests, then the Docker image with Beat This! checked against songs of known tempo
# and bars, then published to ghcr.io/echovaultstudio/siansa-beats for the Docker server to pull: from main as
# latest / cuda, from dev as dev / dev-cuda (to try before it reaches main).
name: Siansa Beats

on:
  push:
    paths:
      - "beats/**"
      - ".github/workflows/beats.yml"
  pull_request:
    paths:
      - "beats/**"
      - ".github/workflows/beats.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # -P (not -I) below: the tests need the user site, where numpy and scipy are installed.
      - name: numpy, for the style model's input and the loudness
        run: python3 -m pip install --break-system-packages --user numpy==1.26.4 || python3 -m pip install --user numpy
      - name: Tempo, bars and the comparison
        run: cd beats && python3 -P tests/test_grid.py
      - name: Bars, phrases, where the beat locks in, and each end's sound
        run: cd beats && python3 -P tests/test_phrase.py && python3 -P tests/test_ends.py && python3 -P tests/test_genres.py && python3 -P tests/test_about.py
      - name: Loudness, fades and key (checked against scipy's filters and ffmpeg's own loudness meter)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 -m pip install --break-system-packages --user scipy || python3 -m pip install --user scipy
          cd beats && python3 -P tests/test_loudness.py
      - name: CPU or GPU
        run: cd beats && python3 -P tests/test_analyser.py
      - name: The service against a fake Navidrome and AudioMuse-AI
        run: cd beats && python3 -P tests/test_service.py
      - name: Several servers (fake Emby and Jellyfin), and finding a song on two of them
        run: cd beats && python3 -P tests/test_match.py && python3 -P tests/test_servers.py
      - name: The page's script parses
        run: cd beats && python3 -P tests/test_page_script.py

  servers:
    # Siansa Beats against real Navidrome, Emby and Jellyfin servers with the same music (0.23.0): the Siansa app's test
    # servers (its scripts/servers, issue #903), their newest releases and the oldest ones the app supports. No model.
    name: Real servers (${{ matrix.set }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: newest
            navidrome: latest
            emby: latest
            jellyfin: latest
          - set: oldest supported
            navidrome: 0.64.2
            emby: 4.8.10.0
            jellyfin: 10.10.7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: echovaultstudio/Siansa
          path: siansa-app
          sparse-checkout: scripts/servers
      - name: numpy and ffmpeg (for making the test library)
        run: |
          python3 -m pip install --quiet --break-system-packages --user numpy==1.26.4 imageio-ffmpeg==0.6.0
          echo "FFMPEG=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Start Navidrome, Emby and Jellyfin with the test library
        env:
          ND_VERSION: ${{ matrix.navidrome }}
          EMBY_VERSION: ${{ matrix.emby }}
          JELLYFIN_VERSION: ${{ matrix.jellyfin }}
        run: |
          siansa-app/scripts/servers/start.sh
          cat "$RUNNER_TEMP/siansa-servers/servers.env" >> "$GITHUB_ENV"
      - name: Siansa Beats on every server, and each song analysed once
        run: cd beats && python3 -P tests/real_servers.py "$SIANSA_TEST_SERVERS" "$SIANSA_TEST_LIBRARY"
      - name: The servers' logs
        if: failure()
        run: |
          tail -40 "$RUNNER_TEMP/siansa-servers/navidrome.log" || true
          docker logs siansa-emby 2>&1 | tail -40 || true
          docker logs siansa-jellyfin 2>&1 | tail -40 || true

  image:
    # Two images: the CPU one (latest) and the cuda one for an NVIDIA GPU (cuda). GitHub's runners have no GPU, so the
    # cuda image is checked running on the CPU, as it does when the container isn't given a GPU.
    name: Image with Beat This! (${{ matrix.variant }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            index: https://download.pytorch.org/whl/cpu
            suffix: ""
          - variant: cuda
            index: https://download.pytorch.org/whl/cu121
            suffix: "-cuda"
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/echovaultstudio/siansa-beats
    steps:
      - uses: actions/checkout@v7

      # CUDA's libraries are several GB: room for them.
      - name: Free disk space
        if: matrix.variant == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Build
        run: |
          docker build --progress=plain --build-arg TORCH_INDEX=${{ matrix.index }} -t siansa-beats:test beats \
            2>&1 | tail -40

      - name: Songs of known tempo and bars
        run: |
          mkdir -p songs && chmod 777 songs
          docker run --rm -v "$PWD/beats/tests:/tests:ro" -v "$PWD/songs:/songs" --user 1000 \
            siansa-beats:test python /tests/make_test_songs.py /songs

      - name: Start a fake Navidrome and AudioMuse-AI with them
        run: |
          python3 -I beats/tests/fakes.py songs 4533 > fake.log 2>&1 &
          sleep 2 && cat fake.log

      - name: Start the service
        run: |
          docker run -d --name beats --network host \
            -e NAVIDROME_URL=http://127.0.0.1:4533 -e NAVIDROME_USER=test -e NAVIDROME_PASSWORD=test \
            -e AUDIOMUSE_URL=http://127.0.0.1:4533 -e AUDIOMUSE_TOKEN=token -e PORT=8090 \
            siansa-beats:test

      - name: Beat This! on every song, and every part of the page
        run: python3 -I beats/tests/e2e.py http://127.0.0.1:8090 songs/catalog.json

      - name: The service's log
        if: always()
        run: |
          docker logs beats 2>&1 | tail -80 || true
          docker inspect --format '{{.State.Health.Status}}' beats || true
          docker image ls siansa-beats:test --format 'Image size: {{.Size}}'

      - name: Publish
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('beats/beats/__init__.py').read())[1])")
          suffix="${{ matrix.suffix }}"
          if [ "$GITHUB_REF" = refs/heads/dev ]; then
            # dev / dev-cuda: the dev branch, never latest or cuda
            first=$([ -z "$suffix" ] && echo dev || echo dev-cuda)
            version="$version-dev"
          else
            first=$([ -z "$suffix" ] && echo latest || echo cuda)
          fi
          for tag in "$first" "$version$suffix" "sha-${GITHUB_SHA::7}$suffix"; do
            docker tag siansa-beats:test "$IMAGE:$tag" && docker push -q "$IMAGE:$tag"
          done
          echo "::notice::Published $IMAGE:$first ($version$suffix)"
