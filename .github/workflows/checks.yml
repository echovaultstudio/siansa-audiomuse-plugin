# Checks that run on every push and pull request, whatever changed (the image's own workflow, beats.yml, runs only
# when Siansa Beats changes): the branch rules require this one.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails if a password, token or API key is committed (the whole history is checked). The repository is public.
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose --no-banner

      # Siansa Beats' Python and the plugins' (still installable, no longer worked on) all parse.
      - name: Python parses
        run: python3 -m compileall -q beats/beats plugins

      # The Siansa Analysis plugin for AudioMuse-AI (an extra, kept working): its tests came here from the app's
      # repository with the libraries AudioMuse-AI ships.
      - name: Plugin tests
        run: |
          pip install --quiet numpy==2.4.6 scipy==1.16.3 av==17.1.0 Flask==3.1.3
          cd plugins/SiansaAnalysis && python3 -m unittest discover -s tests
